<style>

/* ---------- AGE MODEL ---------- */
function lerp(knots,x){
  if(x<=knots[0][0]) return knots[0][1];
  for(let i=1;i<knots.length;i++){
    if(x<=knots[i][0]){const [x0,y0]=knots[i-1],[x1,y1]=knots[i];return y0+(y1-y0)*(x-x0)/(x1-x0);}
  }
  return knots[knots.length-1][1];
}
// energy factor (x resting energy) for growing puppies, easing smoothly down to the adult factor at maturity
function pupKnots(size,mat,adultF){
  return {
    toy:[[2,3.0],[3,3.0],[5.5,2.0],[mat,adultF]],
    small:[[2,3.0],[3,3.0],[5.5,2.0],[mat,adultF]],
    medium:[[2,3.0],[3,3.0],[6,2.0],[mat,adultF]],
    large:[[2,2.8],[3,2.8],[7,1.9],[mat,adultF]],
    giant:[[2,2.6],[3,2.6],[8,1.8],[mat,adultF]],
  }[size];
}

/* ---------- CALCULATION ---------- */
function profile(){
  const b=breed();
  const months=Math.max(1,(+S.ageY)*12+(+S.ageM));
  const mat={toy:10,small:12,medium:14,large:18,giant:24}[b.s];
  const sen={toy:10,small:10,medium:8,large:7,giant:6}[b.s]*12;
  const geriAt=sen+{toy:48,small:48,medium:36,large:30,giant:24}[b.s];
  const isPuppy=months<mat, isSenior=!isPuppy&&months>=sen, isGeri=isSenior&&months>=geriAt;
  const w=wKg(S.weight,S.wUnit), hasTgt=wKg(S.target,S.tUnit)>0, tgt=hasTgt?wKg(S.target,S.tUnit):w;
  const rer=x=>70*Math.pow(x,0.75);
  const act={low:0.85,normal:1,high:b.s==='giant'?1.15:1.25}[S.activity];
  const base=S.neutered==='yes'?1.6:1.8;
  const sizeAdj={toy:1.05,small:1,medium:1,large:0.95,giant:0.88}[b.s];
  const mer=x=>rer(x)*base*act*sizeAdj*(isSenior?0.9:1);
  let kcal, mode='maintain', idealW=w, noTarget=false, pupF=null, growth=null;
  if(isPuppy){
    pupF=lerp(pupKnots(b.s,mat,base*sizeAdj),months);
    kcal=rer(w)*pupF*({low:0.9,normal:1,high:1.1}[S.activity])*(S.shape==='over'?0.85:S.shape==='thin'?1.1:1);
    mode=S.shape==='over'?'lose':S.shape==='thin'?'gain':'maintain';
    if(hasTgt&&tgt>=w*0.95){const exp=lerp(GROWTH[b.s],months)*tgt;growth={expected:exp,ratio:exp>0?w/exp:1};}
  }else if(S.shape==='over'){
    mode='lose';
    if(tgt<w){idealW=tgt;kcal=rer(tgt);}
    else{noTarget=true;idealW=w*0.85;kcal=mer(w)*0.8;}
  }else if(S.shape==='thin'){
    mode='gain'; idealW=Math.max(tgt,w); kcal=mer(idealW);
  }else kcal=mer(w);
  kcal=r5(kcal);
  let meals;
  if(isPuppy){
    meals=months<4?4:months<6?3:((b.s==='toy'||b.s==='small')&&months<9?3:2);
    if(b.s==='toy') meals=months<6?4:3;
  }else meals=isGeri?3:(b.t.includes('toyHypo')?3:2);
  if(hasH('stomach','pancreatitis','bloat','ibd')) meals=Math.max(meals,3);
  if(S.health.has('diabetes')) meals=2;
  return {b,months,isPuppy,isSenior,isGeri,sen,geriAt,w,tgt,kcal,mode,idealW,noTarget,meals,mat,pupF,growth};
}

function homeAnalysis(){
  const r={tot:0,k:0,by:{meat:0,organ:0,dairy:0,carb:0,veg:0,fat:0},kby:{meat:0,organ:0,dairy:0,carb:0,veg:0,fat:0},lines:[]};
  if(!S.srcs.home||S.homeUnsure) return r;
  ING.forEach(i=>{
    if(!(i.id in S.home)) return;
    const g=num(S.home[i.id],0)*unitG('home',S.homeUnit); if(!g) return;
    const k=g*i.k/100;
    r.tot+=g; r.k+=k; r.by[i.c]+=g; r.kby[i.c]+=k; r.lines.push({i,g,k});
  });
  return r;
}

function calc(){
  const p=profile();
  const kd=num(S.dry.kcalkg,DEF_DRY_KCAL), kf=num(S.fresh.kcalkg,DEF_FRESH_KCAL);
  const dryG=S.srcs.dry&&!S.dry.unsure?num(S.dry.amt,0)*unitG('dry',S.dry.unit):0;
  const freshG=S.srcs.fresh&&!S.fresh.unsure?num(S.fresh.amt,0)*unitG('fresh',S.fresh.unit):0;
  const an=homeAnalysis();
  const dry=dryG*kd/1000, fresh=freshG*kf/1000, home=an.k;
  const treats=(parseFloat(S.treatPct)||0)*p.kcal;
  const total=dry+fresh+home+treats;
  const food=dry+fresh+home;
  const diff=total>0?(total-p.kcal)/p.kcal:0;
  return {...p,kd,kf,dryG,freshG,an,intake:{dry,fresh,home,treats,total,food},diff};
}

function defaultSplit(sel){
  // used when some amounts are unknown: complete foods carry the diet, homemade stays a topper if mixed
  const comp=sel.filter(k=>k!=='home'), w={};
  if(!comp.length){ w.home=1; return w; }
  if(sel.includes('home')){ w.home=0.25; comp.forEach(k=>w[k]=0.75/comp.length); }
  else comp.forEach(k=>w[k]=1/comp.length);
  return w;
}
function recommend(c){
  const sel=['dry','fresh','home'].filter(k=>S.srcs[k]);
  const treatRec=Math.min(c.intake.treats,0.10*c.kcal);
  const budget=c.kcal-treatRec;
  const rec={dry:0,fresh:0,home:0};
  const unknown=sel.filter(k=>!(c.intake[k]>0));
  let scale=null;
  if(sel.length&&(unknown.length||c.intake.food<=0)){
    const w=defaultSplit(sel); sel.forEach(k=>rec[k]=budget*w[k]);
  }else if(c.intake.food>0){
    scale=budget/c.intake.food;
    sel.forEach(k=>rec[k]=c.intake[k]*scale);
  }
  return {sel,treatRec,budget,rec,scale,unknown};
}

function buildAdvice(c,rc){
  const A=[]; const add=(t,h,p)=>A.push({t,h,p});
  const n=esc(nm()==='Your dog'?'Your dog':nm());
  const T=c.intake.total, d=c.diff, food=c.intake.food;
  const sel=rc.sel;

  if(T>0&&(rc.unknown.length===0||d>0.10)){
    if(Math.abs(d)<=0.10) add('ok','Calories are on target',`You\u2019re feeding about ${fmt(T)} kcal a day, close to the ${fmt(c.kcal)} kcal ${n==='Your dog'?'your dog':n} needs.`);
    else if(d>0&&c.mode==='gain') add('warn','Still thin on a generous amount',`You\u2019re already feeding about ${Math.round(d*100)}% above the target (${fmt(T)} vs ${fmt(c.kcal)} kcal), yet your dog is thin. Weigh the food to double-check the amounts, and ask your vet to check for worms, tick fever, dental pain or other illness before adding more.`);
    else if(d>0) add(d>0.25?'warn':'tip','Feeding more than needed',`You\u2019re feeding about ${Math.round(d*100)}% more than the target (${fmt(T)} vs ${fmt(c.kcal)} kcal). Move to the amounts in the table over about a week.${c.mode==='lose'?' This extra is likely behind the extra weight.':''}`);
    else if(c.mode==='lose') add('tip','Already below the target',`Your current amount is lower than the weight-loss target, so don\u2019t cut more. If the weight isn\u2019t falling, weigh the food and check for hidden extras like scraps and chews.`);
    else add(c.mode==='gain'||d<-0.25?'warn':'tip','Feeding less than needed',`You\u2019re feeding about ${Math.round(-d*100)}% below the target (${fmt(T)} vs ${fmt(c.kcal)} kcal). Raise the amounts in the table gradually over a week.`);
  }else if(T<=0){
    add('info','No current amounts to compare','Without your current amounts, the plan gives a starting split of the daily target. For a week, weigh what you serve on a kitchen scale, then come back to compare.');
  }
  if(T>0&&rc.unknown.length){
    const nmap={dry:'dry food',fresh:'packed fresh food',home:'homemade meals'};
    const list=rc.unknown.map(k=>nmap[k]).join(' and ');
    add('info','Some amounts are missing',`You didn\u2019t give an amount for ${list}, so the comparison only counts the rest, and the table gives a starting split for ${list}. Weigh what you serve for a week to fine-tune it.`);
  }

  if(c.intake.treats>0.10*c.kcal+1){
    add('tip','Treats are above 10%',`Treats and extras are about ${Math.round(c.intake.treats/c.kcal*100)}% of the day\u2019s calories (roughly ${fmt(c.intake.treats)} kcal). Keep them to 10% or less, about ${fmt(0.1*c.kcal)} kcal, and use part of the regular meal as training treats.`);
  }

  const complete=(c.intake.dry+c.intake.fresh);
  const homeShare=T>0?c.intake.home/(c.intake.food||1):(S.srcs.home&&sel.length===1?1:0);
  const hasComplete=S.srcs.dry||S.srcs.fresh;

  if(S.srcs.dry) add('info','Dry food check','Look for \u201ccomplete and balanced\u201d on the bag, for the right life stage (puppy, adult, or large-breed puppy). Keep it airtight, cool and dry, and switch brands slowly over 7 to 10 days.');
  if(S.srcs.fresh) add('info','Fresh food check','Make sure the pack says \u201ccomplete and balanced.\u201d Some are toppers and not meant to be a whole diet. Follow the storage and \u201cuse within\u201d directions on the pack once it\u2019s opened, and don\u2019t leave a served portion out for more than 30 minutes in warm weather.');
  if(S.srcs.home&&hasComplete&&c.intake.food>0) add('tip','Mixing foods',`When you combine foods, count them together. If you add homemade food or fresh packs, cut the dry food so the total stays near ${fmt(c.kcal)} kcal. The table shows the adjusted amounts.`);

  if(S.srcs.home){
    const an=c.an;
    const needsSupp = !hasComplete || homeShare>0.25;
    if(needsSupp){
      add(c.isPuppy?'warn':'warn','Homemade food needs a vitamin and mineral supplement',
        `${c.isPuppy?'Growing puppies are at high risk from unbalanced homemade food, especially calcium and phosphorus. Use a complete puppy food, or a recipe from a vet nutritionist. ':''}Home-cooked meals are usually short on calcium, vitamins and trace minerals. Ask your vet for a supplement made for home-cooked diets, or use a recipe from a vet nutritionist. Don\u2019t add calcium on your own, because too much is also harmful.`);
    }else if(S.srcs.home){
      add('ok','Homemade as a topper looks fine','Because most calories come from complete food, a small homemade portion is fine. Keep it plain and cooked.');
    }
    if(an.tot>0){
      const p=x=>an.by[x]/an.tot;
      const animal=p('meat')+p('organ');
      if(animal===0&&p('dairy')===0) add('warn','No meat, egg or fish in the mix','Dogs need good-quality animal protein. If you choose a vegetarian plan, it needs expert planning (a vet nutritionist) to avoid protein, taurine and B12 gaps.');
      else if(animal<0.30&&p('dairy')<0.2) add('tip','Protein looks low',`Meat, egg and fish are only about ${Math.round(animal*100)}% of the homemade bowl by weight. Aim for roughly 40 to 50%.`);
      if(p('carb')>0.50) add('tip','Too much rice, roti or other carbs',`Carbs make up about ${Math.round(p('carb')*100)}% of the homemade bowl. Keep them under half and make up the difference with protein and vegetables.`);
      if(p('veg')<0.10) add('tip','Add some vegetables','Aim for roughly 10 to 25% of the bowl as cooked vegetables like pumpkin, carrot or beans, for fibre.');
      if(an.k>0&&an.kby.fat/an.k>0.15) add('tip','Too much ghee or oil',`Added fat gives about ${Math.round(an.kby.fat/an.k*100)}% of the homemade calories. Cut back, especially if your dog has pancreatitis or is overweight.`);
      if(p('organ')>0.05) add('tip','Liver is above 5% of the bowl','Too much liver can cause vitamin A excess. Keep organ meat to about 5% or less of the bowl, or use it once or twice a week.');
      if(p('dairy')>0.15) add('tip','Lots of paneer or curd',`Dairy is about ${Math.round(p('dairy')*100)}% of the bowl. Many dogs are lactose-sensitive, so watch for loose stools and keep dairy modest.`);
    }else if(S.homeUnsure){
      add('info','Homemade recipe suggested','Since you weren\u2019t sure of the amounts, use the homemade recipe in the best food section below as a balanced starting point.');
    }else{
      add('info','Add ingredients for a balance check','Enter the ingredients and grams for your homemade meals, and we\u2019ll check protein, carbs, vegetables and fat.');
    }
  }

  if(S.avoid.size){
    const nmz=AVOID.filter(([k])=>S.avoid.has(k)).map(([,l])=>l.toLowerCase()).join(', ');
    add('tip','Picky eater',`${n==='Your dog'?'Your dog':n} avoids ${nmz}. Stick to meal times, take the bowl away after 20 to 30 minutes, and go easy on treats and scraps, which make picky eating worse. If your dog refuses food for more than 24 to 48 hours, or loses weight, see your vet.`);
  }else if(S.eatsAny){
    add('info','Eats anything and everything','Dogs like this gain weight easily and swallow things they shouldn\u2019t. Keep measuring every meal, count treats, and keep onion, garlic, chocolate, grapes and bones out of reach.');
  }
  if(c.isPuppy){
    if(c.months<2) add('warn','Very young puppy','Puppies under 8 weeks should still be with their mother or on vet-guided weaning. Please check with a vet before using any of these amounts.');
    if(c.b.s==='large'||c.b.s==='giant') add('tip','Large-breed puppy rules','Use a large-breed puppy formula (controlled calcium) and keep your puppy slim. Fast growth stresses developing joints. Don\u2019t add calcium supplements.');
    if(c.growth){
      const r=c.growth.ratio, who=n==='Your dog'?'your puppy':n;
      if(r>1.3) add('warn','Growing faster than typical',`At this age, ${who} would usually weigh about ${wTxt(c.growth.expected)} (based on the adult weight you entered), and is ${wTxt(c.w)}. Fast growth stresses young joints, especially in bigger breeds. Stick to the target amounts, keep treats small, and ask your vet to check body condition.`);
      else if(r<0.7) add('tip','Smaller than typical for this age',`At this age, ${who} would usually weigh about ${wTxt(c.growth.expected)} (based on the adult weight you entered), and is ${wTxt(c.w)}. Make sure the portions are fully eaten, check worming is up to date, and ask your vet if the gap persists.`);
      else add('ok','Growth looks on track',`${who==='your puppy'?'Your puppy':who} is close to the usual weight for this age (about ${wTxt(c.growth.expected)}). Weigh every 2 weeks and re-run this plan monthly.`);
    }
    add('info','Growing puppy',`Feed ${c.meals} meals a day at regular times. Weigh every 2 weeks, and re-run this calculator as your puppy grows because needs change quickly.`);
  }else{
    if(S.neutered==='yes') add('info','Neutered or spayed dogs need fewer calories','Neutering or spaying lowers energy needs by roughly a quarter and often increases appetite. We\u2019ve used a lower factor, so weigh your dog monthly.');
    else add('info','Not neutered or spayed','The plan uses a slightly higher energy factor for intact dogs. Talk to your vet about the right time for neutering or spaying if it\u2019s on your mind, and then re-run this calculator.');
    if(c.isGeri) add('info','Very senior dog',`At this age, appetite and muscle often fade. Feed ${c.meals} smaller meals, warm or soften the food if chewing is hard, and don\u2019t cut calories further if weight is dropping. See your vet every 6 months, and sooner if your dog eats less, drinks more or gets thin.`);
    if(c.isSenior) add('info','Senior dog','Calories are trimmed about 10%, but seniors still need good protein to hold on to muscle. Watch for weight loss, which can signal an illness.');
  }
  return A;
}

function lifeStageHtml(c){
  const span=m=>m>=24?`${Math.round(m/12)} years`:`${m} month${m===1?'':'s'}`;
  const stages=[['Puppy',c.isPuppy],['Adult',!c.isPuppy&&!c.isSenior],['Senior',c.isSenior&&!c.isGeri],['Very senior',c.isGeri]];
  const pills=stages.map(([l,on])=>`<span class="stg${on?' on':''}">${l}</span>`).join('');
  const who=nm()==='Your dog'?'your dog':esc(nm());
  let title,txt;
  if(c.isPuppy){
    title='Life stage: puppy';
    txt=`Adult at about ${c.mat} months (in about ${span(Math.max(1,Math.round(c.mat-c.months)))}). Calories per kilo are highest now and ease down smoothly as growth slows, so amounts change every few weeks. Re-run this plan monthly, and move to adult food gradually over 7 to 10 days when ${who} reaches adulthood.`;
  }else if(!c.isSenior){
    title='Life stage: adult';
    txt=`Senior from about ${span(c.sen)} old (in about ${span(Math.max(1,Math.round(c.sen-c.months)))}). Until then, keep weight steady, and re-run this plan if weight, activity or neutering status changes.`;
  }else if(!c.isGeri){
    title='Life stage: senior';
    txt=`Calories are trimmed about 10%, with good protein to protect muscle. Very senior from about ${span(c.geriAt)} old, when smaller, more frequent meals help. See your vet every 6 to 12 months.`;
  }else{
    title='Life stage: very senior';
    txt='Smaller, more frequent meals, softer food if needed, and a vet check every 6 months. Watch for weight loss, which can be a sign of illness.';
  }
  return `<div class="card"><b>${title}</b><div class="stages">${pills}</div><p style="margin:10px 0 0">${txt}</p></div>`;
}

  /* status line */

  if(rc.unknown.length&&c.intake.total>0) status='From the amounts you entered, that is about '+fmt(c.intake.total)+' kcal a day. Foods marked not sure are not counted.';

  /* weight card */
  let weightHtml='';
  const w=c.w, bmid=(b.min+b.max)/2;
  if(c.isPuppy){
    weightHtml=`<p>Adults of this breed usually weigh <b>${rngTxt(b.min,b.max)}</b>. ${esc(n==='Your dog'?'Your puppy':n)} is ${wTxt(w)} now. Weigh every 2 weeks: steady gain is expected, but a sudden jump or stall is worth a vet chat.</p>`;
  }else{
    weightHtml=`<p>Typical healthy range for this breed: <b>${rngTxt(b.min,b.max)}</b>. ${esc(n==='Your dog'?'Your dog':n)} weighs ${wTxt(w)}. Body shape matters more than the number, so use the rib test.</p>`;
    if(c.mode==='lose'){
      if(c.noTarget) weightHtml+=`<p>Your target weight isn\u2019t below the current weight, so we\u2019ve trimmed calories by about 20%. Go back and set a lower target for a firmer plan.</p>`;
      else{
        const lo=Math.ceil((w-c.idealW)/(w*0.02)), hi=Math.ceil((w-c.idealW)/(w*0.01));
        weightHtml+=`<p>Plan: reach <b>${wTxt(c.idealW)}</b>. A safe pace is 1 to 2% of body weight a week, so expect about <b>${lo} to ${hi} weeks</b>. Weigh every 2 weeks, and ask your vet to check if loss is faster than that.</p>`;
      }
    }
    if(c.mode==='gain') weightHtml+=`<p>The target is set for ${wTxt(c.idealW)}. Raise portions gradually, and have your vet check for worms, tick fever and other causes of thinness before assuming it\u2019s just food.</p>`;
  }

  /* advice + notes */
  const adv=buildAdvice(c,rc);

  const advHtml=adv.map(a=>`<div class="note ${a.t}"><b>${a.h}</b><p>${a.p}</p></div>`).join('');

  const bt=[...new Set(b.t)].map(t=>BREED_NOTES[t]).filter(Boolean);
  if(c.isPuppy&&!(b.s==='large'||b.s==='giant')){}
  const breedHtml=bt.map(x=>`<div class="note info"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('');

  const hs=[...S.health].filter(h=>HEALTH_NOTES[h]);
  const other=S.healthOther.trim();
  const serious=HEALTH.filter(h=>h.serious&&S.health.has(h.id));
  const healthHtml=(hs.length||other)?`${serious.length?`<div class="note warn"><b>Check with your vet first</b><p>${serious.map(s=>s.l.toLowerCase()).join(', ')}: the calorie target above is for healthy dogs. Please confirm any diet change with your vet.</p></div>`:''}${hs.map(h=>`<div class="note info"><b>${HEALTH_NOTES[h][0]}</b><p>${HEALTH_NOTES[h][1]}</p></div>`).join('')}${other?`<div class="note info"><b>You also mentioned</b><p>${esc(other)}. This plan doesn\u2019t account for it, so please check the plan with your vet.</p></div>`:''}`:'';

  const bestHtml=bestFoodSection(c);

    </table></div>

  </section>

  <section class="sec"><h3>What to change</h3>${advHtml}</section>

  ${bestHtml}

  <section class="sec"><h3>Weight and body shape</h3><div class="note info">${weightHtml}</div>
    <p class="hint">Rib test: you should feel the ribs under a thin layer of padding, like the back of your hand, and see a waist from above.</p></section>

  ${breedHtml?`<section class="sec"><h3>For ${esc(b.n.split(' (')[0])}</h3>${breedHtml}</section>`:''}

  <div class="actions">

    <button class="btn ghost" type="button" data-pdf>Download PDF</button>
    <button class="btn ghost" type="button" data-reset>Start over</button>
  </div>
  <p class="hint" id="saveMsg" role="status" aria-live="polite"></p>
  <details class="method"><summary>How we calculate this, and our sources</summary><div class="inner">
    <ul>
      <li><b>Resting energy</b> = 70 \u00d7 (weight in kg)<sup>0.75</sup>.</li>
      <li><b>Puppies:</b> about 3 times resting energy at 2 to 3 months, easing down smoothly to about 2 times mid-growth, then to the adult factor at maturity (10 months for toy breeds up to 24 months for giant breeds). Large and giant breeds start lower (2.6 to 2.8) to slow growth. Activity adjusts the amount by up to 10%.</li>
      <li><b>Adults:</b> 1.6 times (neutered or spayed) or 1.8 times (not), then \u00d7 0.85 for easygoing, \u00d7 1.25 for very active dogs, and a size adjustment (toy +5%, large \u22125%, giant \u221212%). Seniors get \u221210%.</li>
      <li><b>Weight loss</b> uses resting energy at the target weight. <b>Weight gain</b> uses maintenance at the target weight.</li>
      <li><b>Homemade recipe:</b> cooked protein, carb and vegetables in a 2:2:1 ratio by weight (4:3:3 for weight loss), a little oil, 3 g of calcium carbonate per 1,000 kcal, and omega-3 at about 50 mg EPA + DHA per kg.</li>
      <li><b>Packed foods</b> use typical values (kibble ${DEF_DRY_KCAL.toLocaleString()}, fresh ${DEF_FRESH_KCAL.toLocaleString()} kcal per kg) unless you enter your own. A cup is counted as ${CUP_G} g of kibble or ${FRESH_CUP_G} g of fresh food.</li>
    </ul>
    <p>Based on the WSAVA <a href="https://wsava.org" target="_blank" rel="noopener">Global Nutrition Guidelines</a>, the NRC <i>Nutrient Requirements of Dogs and Cats</i> (2006), the <a href="https://www.aafco.org" target="_blank" rel="noopener">AAFCO</a> dog food nutrient profiles and the <a href="https://www.fediaf.org" target="_blank" rel="noopener">FEDIAF</a> guidelines. For a full homemade diet, a veterinary nutritionist can build or check a recipe, for example through <a href="https://balanceit.com" target="_blank" rel="noopener">BalanceIT</a> or the <a href="https://www.acvn.org" target="_blank" rel="noopener">American College of Veterinary Nutrition</a>.</p>
    <p>These are starting points: adjust every 2 to 4 weeks based on body shape and weight. This is general guidance, not veterinary advice. Nothing you enter leaves your device.</p>
  </div></details>`;
}

function foodGuide(c){
  const b=c.b,t=b.t,g=[],small=b.s==='toy'||b.s==='small',big=b.s==='large'||b.s==='giant';
  const stage=c.isPuppy?(big?'large-breed puppy':small?'small-breed puppy':'puppy'):c.isSenior?'senior':(small?'small-breed adult':big?'large-breed adult':'adult');
  g.push(`<b>Life stage:</b> choose a food labelled \u201ccomplete and balanced\u201d for a <b>${stage}</b>.${c.isPuppy&&big?' Large-breed puppy foods control calcium so joints grow steadily.':''}${small&&!c.isSenior?' Small kibble and a higher energy density suit small mouths and fast metabolisms.':''}${c.isSenior?' Look for moderate calories, good-quality protein to protect muscle, and added omega-3.':''}`);
  g.push(`<b>Protein:</b> the first ingredient should be a named animal protein such as chicken, fish, egg or mutton. As a guide, ${c.isPuppy?'puppies do best on about 28% protein or more':'adults do well on roughly 22 to 30%'} (dry-matter basis).`);
  if(c.mode==='lose') g.push('<b>Weight loss:</b> a weight-management food (lower fat, higher protein and fibre) keeps your dog fuller on fewer calories. You can also keep the current food and just measure it.');
  if(c.mode==='gain') g.push('<b>Weight gain:</b> an energy-dense food (often 3,800 kcal per kg or more) lets your dog eat smaller meals and still gain.');
  if(t.includes('skin')||hasH('allergy','skin')) g.push('<b>Skin and coat:</b> a single-protein or limited-ingredient food with omega-3 can help. Change only one thing at a time.');
  if(t.includes('sensitive')||hasH('stomach','ibd')) g.push('<b>Digestion:</b> choose an easily digestible food with moderate fat and prebiotic fibre.');
  if(t.includes('joint')||hasH('joint','dysplasia','spine')||c.isSenior) g.push('<b>Joints:</b> look for omega-3 and glucosamine or chondroitin on the label.');
  if(t.includes('brachy')) g.push('<b>Flat face:</b> kibble shaped for flat-faced breeds is easier to pick up.');
  if(t.includes('purine')) g.push('<b>Dalmatian:</b> pick a low-purine food and avoid organ meats and sardines.');
  if(t.includes('fatsens')) g.push('<b>Low fat:</b> this breed is prone to pancreatitis, so choose a lower-fat food.');
  if(t.includes('toyHypo')) g.push('<b>Tiny dog:</b> an energy-dense small-breed food, fed in small, frequent meals.');
  HEALTH.filter(h=>S.health.has(h.id)&&HEALTH_FOOD[h.id]).forEach(h=>g.push(`<b>${h.l}:</b> ${HEALTH_FOOD[h.id]}`));
  if(S.avoid.size){const nmz=AVOID.filter(([k])=>S.avoid.has(k)).map(([,l])=>l.toLowerCase());g.push(`<b>Picky eater:</b> pick a food without ${nmz.join(', ')}, and keep the ingredient list simple. Try a different texture (wet, fresh or a tasty topper) and warm it slightly to boost the smell.`);}
  if(S.eatsAny) g.push('<b>Eats anything:</b> taste won\u2019t limit your choice, so choose on nutrition alone. These dogs rarely stop eating on their own, so keep measuring.');
  g.push('<b>Fresh-cooked packs:</b> choose ones labelled complete and balanced for the right life stage, and check the kcal per kg on the pack so you can use the amounts in the table above.');
  g.push('<b>Skip:</b> vague \u201cmeat and animal by-products\u201d, artificial colours and added sugar. Check with your vet before choosing a grain-free formula.');
  return g;
}

function recipeRules(c){
  const serious=HEALTH.filter(h=>h.serious&&S.health.has(h.id));
  const purine=c.b.t.includes('purine');
  const avoidProt={chickth:'chicken',chickbr:'chicken',fish:'fish',mutton:'mutton'};
  const allowed=Object.keys(PROT).filter(k=>!(purine&&(k==='fish'||k==='mutton'))&&!S.avoid.has(avoidProt[k]));
  const carbs=Object.keys(CARB).filter(k=>!S.avoid.has(k));
  const shares=c.isPuppy?[10,25]:[25,50,100];
  const oils=c.b.t.includes('fatsens')?['sunflower']:['coconut','sunflower'];
  return {blocked:serious.length>0,serious,allowed,carbs,shares,oils,noOptions:(!allowed.length||!carbs.length)};
}
function fixR(c,rules){
  const lean=c.b.t.includes('fatsens')||c.b.t.includes('purine')||hasH('stomach','ibd');
  if(rules.allowed.length&&!rules.allowed.includes(R.protein)) R.protein=(lean&&rules.allowed.includes('chickbr'))?'chickbr':(rules.allowed.includes('chickth')?'chickth':rules.allowed[0]);
  if(rules.carbs.length&&!rules.carbs.includes(R.carb)) R.carb=rules.carbs.includes('rice')?'rice':rules.carbs[0];
  if(!rules.oils.includes(R.oil)) R.oil=rules.oils[0];
  if(!rules.shares.includes(R.share)){
    R.share=c.isPuppy?10:(S.srcs.home&&(S.srcs.dry||S.srcs.fresh))?((c.intake.food>0&&c.intake.home/c.intake.food>0.3)?50:25):100;
  }
  if(![1,2,3,7].includes(R.days)) R.days=3;
  if(R.open===null) R.open=!!S.srcs.home;
}
function recipeCalc(c){
  const P=PROT[R.protein],C=CARB[R.carb];
  const noVeg=S.avoid.has('veg');
  const ratio=c.mode==='lose'?(noVeg?[.40,.40,.20]:[.40,.30,.30]):(noVeg?[.40,.50,.10]:[.40,.40,.20]);
  const Kh=c.kcal*R.share/100;
  const oilPer=c.b.t.includes('fatsens')?3:P.oil;
  const oil=oilPer*Kh/1000;
  const dens=ratio[0]*P.k+ratio[1]*C.k+ratio[2]*VEG.k;
  const W=(Kh-oil*8.8)/dens*100;
  const cooked={meat:ratio[0]*W,carb:ratio[1]*W,veg:ratio[2]*W};
  const raw={meat:cooked.meat/P.yield,carb:cooked.carb*C.f,veg:cooked.veg*VEG.f};
  const ca=3*Kh/1000; // grams of calcium carbonate / eggshell powder (about 40% calcium)
  return {P,C,ratio,Kh,oil,W,cooked,raw,ca};
}

function recipeCard(c,rules){
  const rc=recipeCalc(c), meals=c.meals, days=R.days;
  const wd=c.mode==='lose'?c.idealW:c.w;
  const chips=(key,items,cur)=>`<div class="chips">${items.map(([v,l])=>`<button type="button" class="chip" data-ropt="${key}" data-val="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
  const shLab={100:'100% (all meals)',50:'50% (half)',25:'25% (topper)',10:'10% (small topper)'};
  const homeDiet=R.share>25;
  const num0=x=>fmt(rg(x));
  const row=(n,perDay,batch)=>`<tr><td>${n}</td><td><b>${perDay}</b></td><td>${batch}</td></tr>`;
  const oilRow=rc.oil>0.2?row(OILS[R.oil].n+' (added once cooled)',`${(Math.round(rc.oil*2)/2)} g<small>${tspTxt(rc.oil)}</small>`,`${Math.round(rc.oil*days)} g<small>${tspTxt(rc.oil*days)}</small>`):'';
  const steps=[
    `Wash the rice (or cube the sweet potato, or measure the oats). Cut the meat into chunks and chop the vegetables small.`,
    `Put everything in <b>one pot or pressure cooker</b> with plain water, enough to just cover. Rice and oats soak up a lot, so top up if it dries out.`,
    `Cook until the meat is cooked right through with no pink, and the rice or sweet potato is soft. That takes about 20 to 25 minutes of simmering, or 3 to 4 whistles in a pressure cooker.`,
    `Shred or chop the meat finely, remove any bones (especially for fish), and mash everything together. Let it cool completely.`,
    `Stir in the oil, then divide the batch into <b>${days*meals} meal portions</b> (${meals} a day for ${days} day${days>1?'s':''}), about <b>${gS(rg(rc.W/meals))}</b> each.`,
    days>3?`Keep 3 days\u2019 worth in the fridge and <b>freeze the rest</b>. Thaw in the fridge overnight.`:`Keep it covered in the fridge and use within 3 days, or freeze portions for up to 3 months.`,
    `Serve lukewarm. At each meal, add the supplements below and mix. Remove uneaten food after 30 minutes.`
  ];
  const notes=[];
  notes.push('No salt, spices, onion, garlic, masala or sugar, ever. Never feed cooked bones.');
  if(c.mode==='lose') notes.push('This version uses more vegetables and less carb to keep your dog full on fewer calories.');
  if(c.b.t.includes('bloat')) notes.push('Deep-chested breeds: split the day into 2 or 3 meals, and rest for an hour after eating.');
  if(c.b.t.includes('toyHypo')&&!c.isPuppy) notes.push('Tiny dogs do best on 3 small meals a day. Don\u2019t let them skip meals.');
  if(c.b.t.includes('skin')||hasH('allergy','skin')) notes.push('Itchy skin or allergies: pick one protein your dog hasn\u2019t eaten much, and stay with it for 8 to 12 weeks.');
  if(c.b.t.includes('fatsens')) notes.push('This breed is prone to pancreatitis, so the recipe uses a lean cut and very little added fat.');
  if(R.oil==='coconut'){
    if(['chickbr','fish','mutton'].includes(R.protein)) notes.push('Coconut oil has almost no omega-6 fat (linoleic acid), which dogs need. With this lean protein, sunflower oil is the better choice, so switch the oil above if you can.');
    else notes.push('Coconut oil is mostly saturated fat. Start with half the amount for the first few days, since it can loosen stools. The chicken thigh supplies the essential omega-6 fats.');
  }
  if(c.b.t.includes('fatsens')) notes.push('Coconut oil is left out for this breed because its saturated fat is hard on a fat-sensitive pancreas.');
  if(R.protein==='fish') notes.push('Use boneless fillets and check twice for bones. Skip fish if it is an allergy trigger.');
  if(S.avoid.has('veg')) notes.push('Your dog avoids vegetables, so they are kept to 10 to 20% of the bowl. Cook them very soft, then blend or mash them into the mix so they are hidden, and add a little more each week.');
  if(S.avoid.size) notes.push('Picky eater tips: warm the food slightly, stir in a spoonful of the cooking water, and introduce any new food a teaspoon at a time. Offer the meal for 20 to 30 minutes and then take it away, and don\u2019t top up with treats. Call your vet if your dog refuses food for more than 24 hours.');
  if(S.eatsAny) notes.push('Eats anything: great for variety. Rotate the protein every few weeks, keep measuring because these dogs rarely stop on their own, and keep onion, garlic, chocolate, grapes and bones out of reach.');
  if(homeDiet&&!c.b.t.includes('purine')&&!S.avoid.has('liver')) notes.push('Once or twice a week, swap about 5% of the meat for cooked chicken liver. Don\u2019t do it more often because vitamin A builds up.');
  const suppHome=homeDiet
    ?`<div class="note warn"><b>Add at every meal, because homemade food is not complete</b><p><b>Calcium:</b> ${(Math.round(rc.ca*10)/10)} g a day of calcium carbonate powder, or finely ground, baked eggshell (${tspTxt(rc.ca)}), which is about ${(Math.round(rc.ca/meals*10)/10)} g per meal. Home-cooked food is very low in calcium, so this is essential.<br><b>Multivitamin and mineral:</b> a powder made for home-cooked dog food, dosed on the label for ${wTxt(wd)}. It covers zinc, iodine, vitamin D, vitamin E and B vitamins that this recipe lacks. Your vet can suggest one sold near you.</p></div>`
    :`<div class="note ok"><b>No calcium or vitamin powder needed</b><p>At ${R.share}% of calories this is a topper on a complete food, which already supplies calcium and vitamins. Adding more could unbalance the diet. Cut the regular food by the same calories (the table above shows the new amounts).</p></div>`;
  return `<details class="recipe" ${R.open?'open':''}>
    <summary>Homemade one-pot recipe for ${esc(nm()==='Your dog'?'your dog':nm())}</summary>
    <div class="inner">
      ${c.isPuppy?'<div class="note warn"><b>Growing puppies: topper only</b><p>Homemade food for puppies often has the wrong calcium and phosphorus. Use a complete puppy food, and keep homemade to a small topper. For a full homemade puppy diet, ask a veterinary nutritionist.</p></div>':''}
      <div class="optrow"><span class="lab">Protein</span>${chips('protein',rules.allowed.map(k=>[k,PROT[k].s]),R.protein)}</div>
      <div class="optrow"><span class="lab">Carb</span>${chips('carb',rules.carbs.map(k=>[k,CARB[k].s]),R.carb)}</div>
      <div class="optrow"><span class="lab">Oil</span>${chips('oil',rules.oils.map(k=>[k,OILS[k].s]),R.oil)}</div>
      <div class="optrow"><span class="lab">Share of the day\u2019s calories</span>${chips('share',rules.shares.map(v=>[v,shLab[v]]),R.share)}</div>
      <div class="optrow"><span class="lab">Cook enough for</span>${chips('days',[[1,'1 day'],[2,'2 days'],[3,'3 days'],[7,'7 days (freeze)']],R.days)}</div>
      <p>This recipe covers <b>${R.share}%</b> of ${poss()} day, about <b>${fmt(rc.Kh)} kcal</b>. After cooking you\u2019ll have about <b>${gS(rg(rc.W))}</b> a day, which is ${meals} meals of about <b>${gS(rg(rc.W/meals))}</b>.${R.share<100?` The other ${fmt(c.kcal-rc.Kh)} kcal come from your regular complete food.`:''}</p>
      <div class="tblwrap"><table>
        <thead><tr><th>Ingredient, raw weight</th><th>Per day</th><th>${days}-day batch</th></tr></thead>
        <tbody>
          ${row(rc.P.n,`${gS(rg(rc.raw.meat))}`,`${gS(rg(rc.raw.meat*days))}`)}
          ${row(rc.C.n,`${gS(rg(rc.raw.carb))}`,`${gS(rg(rc.raw.carb*days))}`)}
          ${row(VEG.n,`${gS(rg(rc.raw.veg))}`,`${gS(rg(rc.raw.veg*days))}`)}
          ${oilRow}
        </tbody></table></div>
      <h3 style="font-size:18px;margin:18px 0 6px">How to cook it</h3>
      <ol class="steps2">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      ${suppHome}
      ${notes.map(t=>`<div class="note info"><p>${t}</p></div>`).join('')}
      <p class="hint">Built to meet adult minimums for protein, fat and calcium, but homemade diets are hard to balance perfectly. For long-term feeding, have your vet or a veterinary nutritionist (for example through BalanceIT) check or customise it.</p>
    </div>
  </details>`;
}

function suppGeneral(c,rules){
  const L=[]; const add=(h,p)=>L.push(`<div class="note info"><b>${h}</b><p>${p}</p></div>`);
  const t=c.b.t, wd=c.mode==='lose'?c.idealW:c.w;
  if(rules.blocked) L.push(`<div class="note warn"><b>Check with your vet first</b><p>With ${rules.serious.map(s=>s.l.toLowerCase()).join(', ')}, ask your vet before starting any supplement.</p></div>`);
  if(c.isPuppy){
    add('Puppies: keep it simple','A complete puppy food needs no calcium, vitamin or mineral extras, and added calcium can harm growing joints, especially in large breeds. Fish oil with DHA is optional, so ask your vet for the dose for your product.');
  }else{
    add('Omega-3 fish oil, daily',`About <b>${Math.max(25,r5(50*wd))} mg of EPA + DHA a day</b>, roughly 50 mg per kg of body weight. Read the label for EPA + DHA per capsule or pump, not total fish oil. It supports skin, coat, joints and heart. Give it with a meal.`);
    if(t.includes('joint')||hasH('joint','dysplasia','spine')||c.isSenior) add('Joint support','A vet-approved glucosamine and chondroitin (or green-lipped mussel) product, dosed on the label for your dog\u2019s weight. Benefits are modest, and keeping your dog lean matters more.');
    if(t.includes('skin')||hasH('allergy','skin')) add('Skin and coat','Omega-3 is the main supplement. Give it daily for 8 to 12 weeks before judging the result, and ask your vet about a higher dose.');
    if(t.includes('sensitive')||hasH('stomach','ibd')) add('Probiotic','A dog-specific probiotic for 2 to 4 weeks can help when changing food or after an upset stomach. Don\u2019t use human or sweetened yogurt as a substitute.');
    if(c.isSenior) add('Senior check-ups','Ask your vet about blood tests every 6 to 12 months, since needs change with age.');
  }
  return `<h3 style="font-size:18px;margin:20px 0 6px">Daily supplements</h3>
    <div class="note ok"><b>Eating a complete and balanced food?</b><p>Then don\u2019t add calcium or a multivitamin. Extra can unbalance it, and too much calcium is harmful.</p></div>${L.join('')}`;
}

function foodBody(c){
  const rules=recipeRules(c); fixR(c,rules);
  const nope=(!rules.blocked&&rules.noOptions)?`<div class="note warn"><b>Too many foods are ticked as refused</b><p>A safe homemade recipe needs at least one protein (${Object.keys(PROT).map(k=>PROT[k].s.toLowerCase()).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}) and one carb (${Object.keys(CARB).map(k=>CARB[k].s.toLowerCase()).join(', ')}). ${c.b.t.includes('purine')?'Dalmatians can\u2019t have fish or mutton, so chicken is needed. ':''}Untick one, or ask a vet nutritionist for a custom recipe.</p></div>`:'';
  const recipe=rules.blocked
    ?`<div class="note warn"><b>Homemade needs a vet\u2019s recipe</b><p>With ${rules.serious.map(s=>s.l.toLowerCase()).join(', ')}, a generic recipe isn\u2019t safe. These conditions need exact limits on phosphorus, sodium, fat or sugar. Ask your vet for a prescription diet or a recipe from a veterinary nutritionist.</p></div>`
    :(nope||recipeCard(c,rules));
  return recipe+suppGeneral(c,rules);
}

function bestFoodSection(c){
  const n=nm()==='Your dog'?'your dog':esc(nm());
  return `<section class="sec" id="bestfood"><h3>Best food for ${n}</h3>
    <div class="card"><b>What to look for in a ready-made food</b><ul class="chk">${foodGuide(c).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div id="foodBody">${foodBody(c)}</div></section>`;
}

/* ---------- SAVED DOGS ---------- */
const LS_KEY='madeforcooper.dogs.v1'; let memDogs=[];
function readDogs(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):memDogs;}catch(e){return memDogs;}}
function writeDogs(a){memDogs=a;try{localStorage.setItem(LS_KEY,JSON.stringify(a));}catch(e){}}
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toISOString().slice(0,10);
function updateDogCount(){const n=readDogs().length;const b=$('#myDogsBtn');if(b)b.innerHTML=`<span class="x">My </span>dogs${n?` (${n})`:''}`;}
function ageText(m){const y=Math.floor(m/12),mo=m%12;return y?`${y} yr${mo?` ${mo} mo`:''}`:`${mo} mo`;}
function saveCurrent(){
  const dogs=readDogs(), p=profile();
  const snap={name:S.name.trim()||'My dog',breed:breed().n,sex:S.sex,neutered:S.neutered,ageMonths:p.months,savedAt:new Date().toISOString(),
    weight:p.w,target:p.tgt,shape:S.shape,activity:S.activity,health:[...S.health],healthOther:S.healthOther,avoid:[...S.avoid],eatsAny:S.eatsAny,srcs:clone(S.srcs),dry:clone(S.dry),fresh:clone(S.fresh),
    home:clone(S.home),homeUnsure:!!S.homeUnsure,treatPct:S.treatPct,wUnit:S.wUnit,tUnit:S.tUnit,homeUnit:S.homeUnit};
  let d=dogs.find(x=>x.id===S.dogId);
  if(d){const log=d.log||[];Object.assign(d,snap);d.log=log;}else{d=Object.assign({id:'d'+Date.now(),log:[]},snap);dogs.push(d);S.dogId=d.id;}
  const last=d.log[d.log.length-1];
  if(last&&last.d===today()) last.kg=p.w; else d.log.push({d:today(),kg:p.w});
  writeDogs(dogs); updateDogCount();
}
function loadDog(d,quiet){
  const bi=BREEDS.findIndex(b=>b.n===d.breed);
  const elapsed=Math.floor((Date.now()-new Date(d.savedAt).getTime())/(30.4375*864e5));
  const m=Math.min(d.ageMonths+Math.max(0,elapsed),20*12+11);
  Object.assign(S,{name:d.name==='My dog'?'':d.name,breed:String(bi),sex:d.sex,neutered:d.neutered,ageY:String(Math.floor(m/12)),ageM:String(m%12),
    wUnit:d.wUnit||'kg',tUnit:d.tUnit||d.wUnit||'kg',homeUnit:d.homeUnit||'g',shape:d.shape,activity:d.activity,health:new Set(d.health),healthOther:d.healthOther||'',avoid:new Set(d.avoid||[]),eatsAny:!!d.eatsAny,srcs:clone(d.srcs),dry:clone(d.dry),fresh:clone(d.fresh),
    home:clone(d.home),homeUnsure:!!d.homeUnsure,treatPct:d.treatPct,targetEdited:true,dogId:d.id});
  S.weight=String(r1(kgDisp(d.weight,S.wUnit))); S.target=String(r1(kgDisp(d.target,S.tUnit)));
  if(!quiet) brandSoon();
}
function withDog(d,fn){const snap=structuredClone(S);loadDog(d,true);try{return fn();}finally{Object.assign(S,snap);}}
function weightChart(d){
  const log=(d.log||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  if(log.length<2) return `<p class="hint">Log ${esc(d.name)}\u2019s weight every 2 to 4 weeks and the trend will appear here.</p>`;
  const U=d.wUnit||'kg', vals=log.map(e=>kgDisp(e.kg,U)), t=kgDisp(d.target,U);
  const lo=Math.min(...vals,t)*0.95, hi=Math.max(...vals,t)*1.05;
  const X=i=>24+i*(252/(log.length-1)), Y=v=>92-(v-lo)/((hi-lo)||1)*72;
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const dt=x=>new Date(x).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 300 120" role="img" aria-label="Weight history for ${esc(d.name)}: from ${r1(vals[0])} to ${r1(vals[vals.length-1])} ${U}, target ${r1(t)} ${U}" style="width:100%;height:auto">
    <line x1="24" x2="276" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--home)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="276" y="${(Y(t)-4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--home)">target ${r1(t)} ${U}</text>
    <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="var(--primary)"/>`).join('')}
    <text x="${X(0).toFixed(1)}" y="${(Y(vals[0])-8).toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="start">${r1(vals[0])}</text>
    <text x="${X(vals.length-1).toFixed(1)}" y="${(Y(vals[vals.length-1])-8).toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="end">${r1(vals[vals.length-1])}</text>
    <text x="24" y="112" font-size="10" fill="var(--muted)">${dt(log[0].d)}</text>
    <text x="276" y="112" font-size="10" fill="var(--muted)" text-anchor="end">${dt(log[log.length-1].d)}</text></svg>`;
}
function dogCard(d){
  const U=d.wUnit||'kg';
  const bi=BREEDS.findIndex(b=>b.n===d.breed);
  if(bi<0) return '';
  const info=withDog(d,()=>{const p=profile();return {kcal:p.kcal,months:p.months,stage:p.isPuppy?'puppy':p.isGeri?'very senior':p.isSenior?'senior':'adult',wt:wTxt(p.w)};});
  return `<div class="card dogcard"><div class="dogtop"><div><b>${esc(d.name)}</b><span class="sub">${esc(d.breed)}, ${ageText(info.months)}, ${info.stage}</span><span class="sub">${info.wt}</span></div><div class="dogk"><b>${fmt(info.kcal)}</b> kcal a day</div></div>
    ${weightChart(d)}
    <div class="row-in" style="margin-top:10px"><input class="in" id="lw-${d.id}" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Weight now" aria-label="Log a new weight for ${esc(d.name)}"><select class="in unitsel" id="lu-${d.id}" aria-label="Weight unit"><option value="kg" ${U==='kg'?'selected':''}>kg</option><option value="lb" ${U==='lb'?'selected':''}>lb</option></select></div>
    <div class="actions" style="margin-top:12px"><button type="button" class="btn ghost" data-logw="${d.id}">Log weight</button><button type="button" class="btn" data-opendog="${d.id}">Open plan</button><button type="button" class="btn ghost" data-deldog="${d.id}">Delete</button></div></div>`;
}
function renderDogs(){
  $('#steps').innerHTML='';
  const dogs=readDogs();
  app.innerHTML=`<div class="panel"><h2>My dogs</h2><p class="lede">Saved on this device only, and nothing is sent to a server. Ages move forward automatically, so puppies get an updated plan as they grow.</p>
    ${dogs.length?dogs.map(dogCard).join(''):'<p>No saved dogs yet. Make a plan, then tap <b>Save</b> at the bottom of it to keep it here and track your dog\u2019s weight over time.</p>'}
    <div class="actions"><button type="button" class="btn" data-newplan>New plan</button></div></div>`;
}

/* ---------- PDF DOWNLOAD ---------- */
async function downloadPdf(btn){
  if(!window.html2pdf){ window.print(); return; }
  const label=btn.textContent; btn.disabled=true; btn.textContent='Preparing PDF...';
  const box=document.createElement('div'); box.className='pdfmode';
  box.innerHTML=$('#app').innerHTML;
  box.querySelectorAll('.actions,.tally').forEach(x=>x.remove());
  box.querySelectorAll('details').forEach(d=>d.setAttribute('open',''));
  box.querySelectorAll('.fillg').forEach(g=>g.removeAttribute('class'));
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const head=document.createElement('div'); head.className='pdfhead';
  head.innerHTML='made for '+esc(brandCur)+'<span>feeding plan, '+date+'</span>';
  box.prepend(head);
  document.body.appendChild(box);
  const cs=getComputedStyle(box);
  box.querySelectorAll('svg').forEach(svg=>{
    const html=svg.outerHTML.replace(/var\((--[\w-]+)\)/g,(m,v)=>cs.getPropertyValue(v).trim()||m);
    const tmp=document.createElement('div'); tmp.innerHTML=html; svg.replaceWith(tmp.firstElementChild);
  });
  const fname=(brandCur.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'dog')+'-feeding-plan.pdf';
  try{
    await html2pdf().set({
      margin:[10,8,12,8], filename:fname,
      image:{type:'jpeg',quality:0.96},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:760},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['.note','tr','.card','h3','.bowlcard','.hero','li']}
    }).from(box).save();
  }catch(err){ window.print(); }
  finally{ box.remove(); btn.disabled=false; btn.textContent=label; }
}

/* ---------- LOGO NAME SWAP ---------- */
let brandCur='cooper', brandTimers=[], brandDeb=null;
function brandNext(){return S.name.trim().toLowerCase().slice(0,16)||'cooper';}
function brandSoon(){clearTimeout(brandDeb);brandDeb=setTimeout(brandSwap,450);}
function brandSwap(){
  const next=brandNext(); if(next===brandCur) return;
  const wrap=$('#bn'), txt=$('#bnText'); if(!wrap||!txt) return;
  brandTimers.forEach(clearTimeout); brandTimers=[];
  wrap.className='bn';
  const finish=()=>{txt.textContent=next;brandCur=next;document.title='made for '+next+': dog feeding calculator';};
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}
  wrap.classList.add('slash');
  brandTimers.push(setTimeout(()=>wrap.classList.add('leave'),240));
  brandTimers.push(setTimeout(()=>{finish();wrap.className='bn enter';},430));
  brandTimers.push(setTimeout(()=>{wrap.className='bn';},950));
}

/* ---------- RENDER + EVENTS ---------- */
function render(){
  if(S.view==='dogs'){renderDogs();window.scrollTo({top:0,behavior:'auto'});return;}
  renderSteps();
  if(S.step===0){app.innerHTML=step0();refreshStep0();}
  else if(S.step===1) app.innerHTML=step1();
  else if(S.step===2){app.innerHTML=step2();updateTally();}
  else app.innerHTML=renderPlan();
  window.scrollTo({top:0,behavior:'auto'});
}

function refreshStep0(){
  const b=breed(); if(!$('#breedHint')) return;
  const months=(+S.ageY)*12+(+S.ageM);
  let puppy=false;
  if(b){
    const mat={toy:10,small:12,medium:14,large:18,giant:24}[b.s];
    puppy=months<mat;
    const frac=S.sex==='male'?0.65:S.sex==='female'?0.35:0.5;
    const midKg=Math.round((b.min+(b.max-b.min)*frac)*2)/2;
    $('#breedHint').textContent=`Typical adult weight: ${rngTxt(b.min,b.max)}.${S.sex==='male'?' Males tend to sit toward the higher end.':S.sex==='female'?' Females tend to sit toward the lower end.':''}`;
    if(!S.targetEdited){S.target=String(r1(kgDisp(midKg,S.tUnit)));$('#target').value=S.target;}
    $('#targetBtns').innerHTML=[['Low',b.min],['Suggested',midKg],['High',b.max]].map(x=>`<button type="button" class="minibtn" data-tg="${r1(kgDisp(x[1],S.tUnit))}">${x[0]} ${r1(kgDisp(x[1],S.tUnit))} ${S.tUnit}</button>`).join('');
    $('#targetHint').textContent=puppy?'The expected adult weight. We\u2019ve filled in a suggestion for the breed and gender, and you can change it.':'A healthy goal weight. We\u2019ve filled in a suggestion for the breed and gender. If your dog is just right at a different weight, that\u2019s fine, so say \u201cJust right\u201d below.';
  }
  $('#targetLabel').textContent=puppy?'Expected adult weight':'Target weight';
  $('#actHint').textContent=puppy?'For puppies this changes the amount only a little, since growth drives most of their needs.':'';
}

function setPath(path,val){
  const p=path.split('.');
  if(p.length===1) S[p[0]]=val; else S[p[0]][p[1]]=val;
}

function validate(i){
  const e=$('#err');
  const bad=m=>{if(e)e.textContent=m;return false;};
  if(i===0){
    if(S.breed==='') return bad('Choose a breed to continue.');
    if(S.sex==='') return bad('Choose male or female to continue.');
    const w=wKg(S.weight,S.wUnit);
    if(!(w>=0.3&&w<=120)) return bad('Enter your dog\u2019s weight, between 0.3 and 120 kg (0.7 to 265 lb).');
    if(S.target!==''&&!(wKg(S.target,S.tUnit)>=0.3)) return bad('Enter a valid target weight, or clear it.');
  }
  if(i===2&&!(S.srcs.dry||S.srcs.fresh||S.srcs.home)) return bad('Tick at least one food your dog eats.');
  return true;
}

function go(n){
  S.view='';
  if(n>S.step&&!validate(S.step)) return;
  S.step=n; S.maxStep=Math.max(S.maxStep,n); render();
}

app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.seg){
    const name=t.dataset.seg; S[name]=t.dataset.val;
    t.parentElement.querySelectorAll('.segbtn').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));
    if(name==='treatPct') updateTally();
    if(name==='sex'){
      const nl=$('#neutLab'); if(nl) nl.textContent=neutLabel();
      if(S.sex==='male') S.health.delete('pregnant');
      refreshStep0();
    }
  }else if(t.dataset.chip){
    const id=t.dataset.chip;
    S.health.has(id)?S.health.delete(id):S.health.add(id);
    t.setAttribute('aria-pressed',String(S.health.has(id)));
    const hc=$('#hcount'); if(hc){const n=S.health.size+(S.healthOther.trim()?1:0);hc.textContent=n?`${n} selected.`:'Nothing selected.';}
  }else if(t.dataset.src){
    const k=t.dataset.src; S.srcs[k]=!S.srcs[k];
    t.setAttribute('aria-pressed',String(S.srcs[k]));
    $('#srcDetails').innerHTML=srcDetails(); updateTally();
  }else if(t.dataset.unsure){
    const k=t.dataset.unsure;
    if(k==='home') S.homeUnsure=!S.homeUnsure; else{ S[k].unsure=!S[k].unsure; if(S[k].unsure) S[k].amt=''; }
    $('#srcDetails').innerHTML=srcDetails(); updateTally();
  }else if(t.dataset.kc){
    const [k,v]=t.dataset.kc.split(':'); S[k].kcalkg=v; $('#srcDetails').innerHTML=srcDetails(); updateTally();
  }else if(t.dataset.ing){
    const id=t.dataset.ing;
    if(id in S.home) delete S.home[id]; else S.home[id]='';
    $('#homeBlock').innerHTML=homeBlock(); updateTally();
  }else if(t.dataset.rm){
    delete S.home[t.dataset.rm]; $('#homeBlock').innerHTML=homeBlock(); updateTally();
  }else if(t.dataset.tg){
    S.target=t.dataset.tg; S.targetEdited=true; $('#target').value=S.target;
  }else if(t.dataset.ropt){
    const k=t.dataset.ropt; R[k]=(k==='share'||k==='days')?+t.dataset.val:t.dataset.val;
    $('#foodBody').innerHTML=foodBody(calc());
  }else if(t.hasAttribute('data-savedog')){
    saveCurrent(); const m=$('#saveMsg'); if(m) m.textContent='Saved on this device. Find it under My dogs, where you can log weight over time.';
  }else if(t.dataset.opendog){
    const d=readDogs().find(x=>x.id===t.dataset.opendog); if(d){loadDog(d);S.view='';S.step=3;S.maxStep=3;render();}
  }else if(t.dataset.deldog){
    if(window.confirm('Delete this dog and its weight history from this device?')){writeDogs(readDogs().filter(x=>x.id!==t.dataset.deldog));updateDogCount();renderDogs();}
  }else if(t.dataset.logw){
    const id=t.dataset.logw, inp=$('#lw-'+id), usel=$('#lu-'+id), kg=wKg(inp&&inp.value,usel&&usel.value);
    if(kg>=0.3&&kg<=120){
      const dogs=readDogs(), d=dogs.find(x=>x.id===id);
      if(d){d.weight=kg;d.wUnit=usel?usel.value:d.wUnit;const last=d.log[d.log.length-1];if(last&&last.d===today())last.kg=kg;else d.log.push({d:today(),kg});writeDogs(dogs);renderDogs();}
    }else if(inp){inp.focus();}
  }else if(t.hasAttribute('data-newplan')){
    Object.assign(S,{step:0,maxStep:0,view:'',dogId:null,name:'',breed:'',sex:'',ageY:'2',ageM:'0',neutered:'yes',weight:'',target:'',targetEdited:false,shape:'ideal',activity:'normal',health:new Set(),healthOther:'',avoid:new Set(),eatsAny:false,srcs:{dry:false,fresh:false,home:false},dry:{amt:'',unit:S.dry.unit,unsure:false,kcalkg:String(DEF_DRY_KCAL)},fresh:{amt:'',unit:S.fresh.unit,unsure:false,kcalkg:String(DEF_FRESH_KCAL)},home:{},homeUnsure:false,treatPct:'0.05'});
    Object.assign(R,{protein:null,carb:'rice',oil:'coconut',share:null,days:3,open:null}); brandSoon(); render();
  }else if(t.hasAttribute('data-next')) go(S.step+1);
  else if(t.dataset.go!==undefined) go(+t.dataset.go);
  else if(t.hasAttribute('data-pdf')) downloadPdf(t);
  else if(t.hasAttribute('data-reset')){
    Object.assign(S,{step:0,maxStep:0,view:'',dogId:null,name:'',breed:'',sex:'',ageY:'2',ageM:'0',neutered:'yes',weight:'',target:'',targetEdited:false,shape:'ideal',activity:'normal',health:new Set(),healthOther:'',avoid:new Set(),eatsAny:false,srcs:{dry:false,fresh:false,home:false},dry:{amt:'',unit:S.dry.unit,unsure:false,kcalkg:String(DEF_DRY_KCAL)},fresh:{amt:'',unit:S.fresh.unit,unsure:false,kcalkg:String(DEF_FRESH_KCAL)},home:{},homeUnsure:false,treatPct:'0.05'});
    Object.assign(R,{protein:null,carb:'rice',oil:'coconut',share:null,days:3,open:null});
    brandSoon();
    render();
  }
});

$('#steps').addEventListener('click',e=>{
  const t=e.target.closest('button[data-go]'); if(t&&!t.disabled) go(+t.dataset.go);
});

app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){
    setPath(t.dataset.bind,t.value);
    if(t.dataset.bind==='target') S.targetEdited=true;
    if(t.dataset.bind==='name') brandSoon();
    if(t.dataset.bind==='healthOther'){const hc=$('#hcount');if(hc){const n=S.health.size+(S.healthOther.trim()?1:0);hc.textContent=n?`${n} selected.`:'Nothing selected.';}}
    if(S.step===2) updateTally();
  }else if(t.dataset.home){
    S.home[t.dataset.home]=t.value;
    const i=ING.find(x=>x.id===t.dataset.home);
    const kc=$('#kc-'+i.id); if(kc) kc.textContent=homeKc(i);
    const ht=$('#homeTotals'); if(ht) ht.textContent=homeTotalsText();
    updateTally();
  }
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.eatsany){
    S.eatsAny=t.checked;
    if(S.eatsAny){S.avoid.clear();app.querySelectorAll('input[data-avoid]').forEach(i=>{i.checked=false;});}
    return;
  }
  if(t.dataset.avoid){
    t.checked?S.avoid.add(t.dataset.avoid):S.avoid.delete(t.dataset.avoid);
    if(S.avoid.size){S.eatsAny=false;const e=$('input[data-eatsany]');if(e)e.checked=false;}
    return;
  }
  if(t.dataset.unitsel){
    commitFocus();
    const k=t.dataset.unitsel,o=S[k],v=t.value,x=parseFloat(o.amt);
    if(isFinite(x)&&x>0) o.amt=String(convAmt(k,x,o.unit,v));
    o.unit=v; $('#srcDetails').innerHTML=srcDetails(); updateTally(); return;
  }
  if(t.dataset.homeunit){
    commitFocus();
    const v=t.value;
    Object.keys(S.home).forEach(id=>{const x=parseFloat(S.home[id]);if(isFinite(x)&&x>0)S.home[id]=String(v==='oz'?Math.round(x*unitG('home',S.homeUnit)/OZ*100)/100:Math.round(x*unitG('home',S.homeUnit)));});
    S.homeUnit=v; $('#homeBlock').innerHTML=homeBlock(); updateTally(); return;
  }
  if(t.dataset.wsel){
    commitFocus();
    const f=t.dataset.wsel, v=t.value, key=f==='weight'?'wUnit':'tUnit', old=S[key];
    const x=parseFloat(S[f]);
    if(isFinite(x)&&x>0) S[f]=String(r1(kgDisp(wKg(x,old),v)));
    S[key]=v; $('#'+f).value=S[f];
    if(f==='weight'&&!S.targetEdited){S.tUnit=v;const ts=$('#tsel');if(ts)ts.value=v;}
    refreshStep0(); return;
  }
  if(t.dataset.src){
    S.srcs[t.dataset.src]=t.checked;
    $('#srcDetails').innerHTML=srcDetails();
    $('#srcCount').textContent=srcCountText();
    const er=$('#err'); if(er) er.textContent='';
    updateTally(); return;
  }
  if(t.dataset.bind){
    setPath(t.dataset.bind,t.value);
    if(S.step===0&&['breed','ageY','ageM'].includes(t.dataset.bind)) refreshStep0();
    if(S.step===2) updateTally();
  }
});

$('#myDogsBtn').addEventListener('click',()=>{S.view='dogs';render();});
updateDogCount();
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('recipe')) R.open=e.target.open;},true);

render();
</script>
